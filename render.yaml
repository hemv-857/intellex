# Render blueprint for Intellex.
#
# Deploy with:  render blueprint launch      (or connect the repo in the dashboard)
#
# Shape: one Node web service, because collection runs are fire-and-forget after
# the response returns and need a process that stays alive. A serverless platform
# would freeze them mid-write, and SQLite needs a real filesystem. That is also
# why this cannot run on Vercel — vercel.json is only a redirect to here.
#
# This blueprint targets the FREE plan so it deploys without a card. The cost of
# that is real and worth stating plainly:
#   - No persistent disk. The database below lives in the build directory and is
#     WIPED ON EVERY DEPLOY. Do not put anything in it you cannot lose.
#   - The instance sleeps after ~15 minutes idle, and a collection run in flight
#     when it sleeps will be interrupted.
# For either problem, upgrade to `starter` and re-add the `disk:` block at the
# bottom of this file (it is present but commented out), then point
# DATABASE_URL back at /var/data/intellex.
#
# Before the first deploy, set the secrets marked `sync: false`:
#   APP_TOKEN       single-tenant access token
#   SCHEDULER_KEY   enables scheduled collections
#   OPENROUTER_API_KEY  chat completions (planning, extraction, expansion)
#   TAVILY_API_KEY      web search + page reading
# Generate with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

services:
  - type: web
    name: intellex
    runtime: node
    plan: free # 'starter' needs a card on the account; see the note above
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: bun install --frozen-lockfile && bunx prisma migrate deploy && bun run build
    startCommand: bun run start:render
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: BUN_VERSION
        value: "1.4.2"
      - key: NODE_ENV
        value: production

      # On the free plan there is no persistent disk, so the database sits in
      # the project directory and is reset on every deploy. With a disk mounted
      # (starter plan) change this to file:/var/data/intellex/custom.db.
      - key: DATABASE_URL
        value: file:/opt/render/project/src/db/custom.db

      # Public origin, used to build shareable /share/<token> links.
      - key: NEXT_PUBLIC_APP_URL
        generateValue: true

      # Single-tenant auth and the scheduler. Both fail closed when unset.
      - key: APP_TOKEN
        sync: false
      - key: SCHEDULER_KEY
        sync: false

      # Provider credentials, read straight from the environment.
      # TAVILY_API_KEY is the one that matters most: without it the engine
      # cannot find or read any source, so collection runs find nothing.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # Scheduling runs inside this long-lived process.
      - key: IN_PROCESS_SCHEDULER
        value: "1"

    # Uncomment on the `starter` plan to make the database survive deploys.
    # Requires a payment method on the account.
    # disk:
    #   name: intellex-data
    #   mountPath: /var/data/intellex
    #   sizeGB: 1